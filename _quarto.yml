project:
  type: website
  output-dir: _site
  render: 
    - index.qmd
    - research.qmd
    - teaching.qmd
    - cv.qmd
    - blogs.qmd
    - blogs/*/index.qmd

website:
  title: "Michael D. Siciliano"
  site-url: "https://m-siciliano.github.io"
  description: "Michael D. Siciliano — Professor of Public Administration at the University of Illinois Chicago. Research on interorganizational networks, collaborative governance, and social network analysis."
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: About
      - research.qmd
      - teaching.qmd
      - cv.qmd
      - blogs.qmd
    right:
      - icon: envelope
        href: mailto:sicilian@uic.edu
        aria-label: Email
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=Pq3gu_MAAAAJ
        aria-label: Google Scholar
      - icon: github
        href: https://github.com/m-siciliano
        aria-label: GitHub

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: left
    link-external-newwindow: true
    link-external-icon: true
    include-in-header: 
      - text: <meta name="google-site-verification" content="wmk6bxER3-ttJtcJTQ5ET0wgPTw3tdtN-3O_AGnTTVA" />

editor: source

